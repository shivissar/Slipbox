{%- if q -%}
<h2>Results for “{{ q }}”</h2>
<ul class="cards">
  {%- for r in results %}
  <li>
    <a class="nc" href="{{ url_for('view', note_id=r.id) }}">
      <span class="nc-title">{{ r.title }}</span>
      {%- if r.snip %}<span class="nc-snip">{{ r.snip|safe }}</span>{% endif %}
      <span class="nc-meta">{{ r.modified[:10] if r.modified else "" }}</span>
    </a>
  </li>
  {%- else %}
  <li class="empty-list">No notes match “{{ q }}”.</li>
  {%- endfor %}
</ul>
{%- endif -%}
